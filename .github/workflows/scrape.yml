name: Update APIS Express eMAG offers
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apisexpress-emag-update
          path: output/*
          if-no-files-found: warn
          retention-days: 14
